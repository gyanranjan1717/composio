<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold sample labeller</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#dcd9d2; --accent:#1f5f8b; --done:#2e7d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181a; --card:#212327; --ink:#ecebe7; --muted:#a09d96; --line:#383b41; --accent:#7db8e0; --done:#6cc08b; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:920px; margin:0 auto; padding:24px 16px 96px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:20px; }
  pre { white-space:pre-wrap; font:13px/1.5 ui-monospace, monospace; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px; }
  .card.complete { border-left:4px solid var(--done); }
  .card h2 { font-size:17px; margin:0; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
  a { color:var(--accent); }
  .fields { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px 16px; }
  label.field { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:3px; }
  select, input[type=text] { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px; }
  .checks { display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--ink); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:16px; align-items:center; justify-content:center; }
  button { font:inherit; padding:8px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:var(--bg); cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Gold sample labeller</h1>
  <p class="lead">Label each app from the vendor's own docs, without looking at the agent's answers. Your work is saved in this browser as you go. When all are done, download the file and save it as <code>data/goldSample.json</code>.</p>
  <details><summary>Rubric (the same definitions the agent uses)</summary><pre id="rubric"></pre></details>
  <div id="cards"></div>
</main>
<div class="bar"><span id="progress"></span><button id="download">Download goldSample.json</button></div>
<script id="labellerData" type="application/json">__LABELLER_DATA__</script>
<script>
const labellerData = JSON.parse(document.getElementById("labellerData").textContent);
const storageKey = "goldSampleLabels";
const singleChoiceFields = ["accessLevel", "apiType", "existingMcp", "buildable", "mainBlocker"];
let labels = {};
try { labels = JSON.parse(localStorage.getItem(storageKey)) || {}; } catch (error) { labels = {}; }

function labelFor(appId) {
  if (!labels[appId]) labels[appId] = { authMethods: [], evidenceUrl: "", notes: "" };
  return labels[appId];
}
function isComplete(appId) {
  const label = labelFor(appId);
  return label.authMethods.length > 0 && singleChoiceFields.every((field) => label[field]) && label.evidenceUrl.trim() !== "";
}
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(labels)); } catch (error) { /* storage unavailable: labels stay in memory */ }
  refreshStatus();
}
function refreshStatus() {
  let completeCount = 0;
  for (const app of labellerData.apps) {
    const complete = isComplete(app.id);
    document.getElementById("card" + app.id).classList.toggle("complete", complete);
    if (complete) completeCount += 1;
  }
  document.getElementById("progress").textContent = completeCount + " of " + labellerData.apps.length + " apps fully labelled";
}
function element(tag, properties, children) {
  const node = Object.assign(document.createElement(tag), properties || {});
  for (const child of children || []) node.append(child);
  return node;
}
function buildSelect(app, field) {
  const select = element("select", {}, [element("option", { value: "", textContent: "choose" })]);
  for (const value of labellerData.enums[field]) select.append(element("option", { value, textContent: value }));
  select.value = labelFor(app.id)[field] || "";
  select.onchange = () => { labelFor(app.id)[field] = select.value; save(); };
  return element("label", { className: "field" }, [field, select]);
}
function buildAuthChecks(app) {
  const box = element("div", { className: "checks" });
  for (const method of labellerData.enums.authMethods) {
    const input = element("input", { type: "checkbox", checked: labelFor(app.id).authMethods.includes(method) });
    input.onchange = () => {
      const chosen = new Set(labelFor(app.id).authMethods);
      if (input.checked) chosen.add(method); else chosen.delete(method);
      labelFor(app.id).authMethods = [...chosen].sort();
      save();
    };
    box.append(element("label", {}, [input, " " + method]));
  }
  return element("label", { className: "field" }, ["authMethods (tick all documented)", box]);
}
function buildText(app, field, placeholder) {
  const input = element("input", { type: "text", placeholder, value: labelFor(app.id)[field] });
  input.oninput = () => { labelFor(app.id)[field] = input.value; save(); };
  return element("label", { className: "field" }, [field, input]);
}
function buildCard(app) {
  const search = "https://www.google.com/search?q=" + encodeURIComponent(app.name + " API authentication documentation");
  const meta = element("div", { className: "meta" }, [
    "#" + app.id + " · " + app.category + " · hint: " + app.hint + " · ",
    element("a", { href: search, target: "_blank", rel: "noopener", textContent: "search docs" }),
  ]);
  const fields = element("div", { className: "fields" }, [
    buildAuthChecks(app),
    ...singleChoiceFields.map((field) => buildSelect(app, field)),
    buildText(app, "evidenceUrl", "docs page you checked"),
    buildText(app, "notes", "optional"),
  ]);
  return element("div", { className: "card", id: "card" + app.id }, [element("h2", { textContent: app.name }), meta, fields]);
}
document.getElementById("rubric").textContent = labellerData.rubric;
for (const app of labellerData.apps) document.getElementById("cards").append(buildCard(app));
refreshStatus();
document.getElementById("download").onclick = () => {
  const output = labellerData.apps.map((app) => ({ ...app, label: labelFor(app.id), complete: isComplete(app.id) }));
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: "application/json" });
  const link = element("a", { href: URL.createObjectURL(blob), download: "goldSample.json" });
  link.click();
};
</script>
</body>
</html>
